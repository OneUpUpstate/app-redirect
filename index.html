<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Store Redirect</title>
<script type="text/javascript">
        window.onload = function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
 
            // Redirect to the respective app store
            if (/android/i.test(userAgent)) {
                window.location.href = 'appspace://';
                setTimeout(function() {
                    window.location.href = 'https://play.google.com/store/apps/details?id=com.appspace.mobile&hl=en_US&gl=US'; // Android app link
                }, 1500);
            } else if (/iPhone|iPad|iPod/i.test(userAgent)) {
                window.location.href = 'appspace://';
                setTimeout(function() {
                    window.location.href = 'https://apps.apple.com/us/app/appspace/id1537783177'; // iOS app link
                }, 1500);
            } else {
                window.location.href = 'https://upstate-oneup.cloud.appspace.com/console/#!/browse/home'; // Redirect to your website or default page
            }
        }
</script>
</head>
<body>
<p>If you are not redirected, <a href="https://upstate-oneup.cloud.appspace.com/console/#!/browse/home">click here</a>.</p>
</body>
</html>
